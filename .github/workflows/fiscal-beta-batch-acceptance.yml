name: Fiscal Beta Batch Acceptance

on:
  push:
    branches: [main]
  pull_request:

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -l includes/class-spf-fiscal-beta-batch-acceptance.php
          php -l tests/fiscal-beta-batch-acceptance-smoke.php
          php -l sistema-para-farmacias.php
      - name: Async acceptance smoke
        run: php tests/fiscal-beta-batch-acceptance-smoke.php
      - name: Batch acceptance invariants
        shell: bash
        run: |
          set -euo pipefail
          acceptance='includes/class-spf-fiscal-beta-batch-acceptance.php'
          main='sistema-para-farmacias.php'
          grep -Fq "Version: 0.23.0" "$main"
          grep -Fq "define('SPF_VERSION','0.23.0')" "$main"
          grep -Fq "require_once SPF_PLUGIN_DIR.'includes/class-spf-fiscal-beta-batch-acceptance.php'" "$main"
          grep -Fq 'new SPF_Fiscal_Beta_Batch_Acceptance' "$main"
          grep -Fq "'submit_intent'" "$acceptance"
          grep -Fq "'ticket_received'" "$acceptance"
          grep -Fq "'poll_intent'" "$acceptance"
          grep -Fq "'poll_result'" "$acceptance"
          grep -Fq "'evidence_archived'" "$acceptance"
          grep -Fq "'ticket_consistency'" "$acceptance"
          grep -Fq "'request_hash'" "$acceptance"
          grep -Fq "'request_zip'" "$acceptance"
          grep -Fq "'cdr_hashes'" "$acceptance"
          grep -Fq "'archive_manifest'" "$acceptance"
          grep -Fq "'projection'" "$acceptance"
          grep -Fq "'production_isolated'" "$acceptance"
      - name: Final poll is bound to its own preceding intent
        shell: bash
        run: |
          set -euo pipefail
          acceptance='includes/class-spf-fiscal-beta-batch-acceptance.php'
          grep -Fq '$event_id($event) >= $event_id($archive_event)' "$acceptance"
          grep -Fq '$previous_poll_event = null' "$acceptance"
          grep -Fq "['poll_intent','poll_result','poll_error']" "$acceptance"
          grep -Fq "=== 'poll_intent'" "$acceptance"
          grep -Fq '$event_id($ticket_event) < $event_id($final_poll_intent)' "$acceptance"
          grep -Fq '$event_id($final_poll_intent) < $event_id($final_poll)' "$acceptance"
          grep -Fq '$event_id($final_poll) < $event_id($archive_event)' "$acceptance"
      - name: Acceptance remains diagnostic only
        shell: bash
        run: |
          set -euo pipefail
          acceptance='includes/class-spf-fiscal-beta-batch-acceptance.php'
          if grep -En '__soapCall|wp_remote_|curl_exec|fsockopen|stream_socket_client|SoapClient' "$acceptance"; then
            echo 'Batch acceptance verifier must not perform network operations'
            exit 1
          fi
          if grep -En '\$wpdb->(insert|update|delete)\(' "$acceptance"; then
            echo 'Batch acceptance verifier must not mutate database state'
            exit 1
          fi
          if grep -En 'cdr_zip_bytes|cdr_xml_bytes|private_key_pem|certificate_pem' "$acceptance"; then
            echo 'Batch acceptance verifier must not consume or expose raw fiscal evidence or credentials'
            exit 1
          fi
      - name: Acceptance stays country-neutral and production-safe
        shell: bash
        run: |
          set -euo pipefail
          acceptance='includes/class-spf-fiscal-beta-batch-acceptance.php'
          if grep -En 'SUNAT|\bRUC\b|\bDNI\b|e-beta\.sunat\.gob\.pe|e-factura\.sunat\.gob\.pe' "$acceptance"; then
            echo 'Batch acceptance verifier must remain country-neutral'
            exit 1
          fi
          grep -Fq "=== 'not_sent'" "$acceptance"
          if grep -En '\$wpdb->(insert|update|delete)\(' "$acceptance"; then
            echo 'Batch acceptance verifier must never mutate production fiscal status'
            exit 1
          fi
