name: Fiscal Evidence Archive

on:
  push:
    branches: [main]
  pull_request:

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax for evidence layer
        run: |
          php -l includes/fiscal/interface-spf-fiscal-evidence-store.php
          php -l includes/class-spf-fiscal-evidence-store-registry.php
          php -l includes/fiscal/class-spf-fiscal-evidence-filesystem.php
          php -l includes/class-spf-fiscal-evidence-manager.php
          php -l includes/class-spf-fiscal-batch-beta-manager.php
          php -l includes/class-spf-fiscal-transport-manager.php
          php -l includes/countries/peru/class-spf-fiscal-transport-peru-beta.php
          php -l tests/fiscal-evidence-archive-smoke.php
          php -l tests/fiscal-invoice-evidence-smoke.php
      - name: Fiscal batch evidence archive smoke
        run: php tests/fiscal-evidence-archive-smoke.php
      - name: Fiscal invoice evidence archive smoke
        run: php tests/fiscal-invoice-evidence-smoke.php
      - name: Private archive invariants
        shell: bash
        run: |
          set -euo pipefail
          provider='includes/fiscal/class-spf-fiscal-evidence-filesystem.php'
          manager='includes/class-spf-fiscal-evidence-manager.php'
          batch_manager='includes/class-spf-fiscal-batch-beta-manager.php'
          invoice_manager='includes/class-spf-fiscal-transport-manager.php'
          transport='includes/countries/peru/class-spf-fiscal-transport-peru-beta.php'
          country='includes/countries/class-spf-country-peru.php'
          main='sistema-para-farmacias.php'

          grep -Fq 'SPF_FISCAL_EVIDENCE_DIR' "$provider"
          grep -Fq 'spf_evidence_root_web' "$provider"
          grep -Fq 'LOCK_EX' "$provider"
          grep -Fq 'hash_file' "$provider"
          grep -Fq 'rename($tmp, $target)' "$provider"
          grep -Fq "'evidence_store'=>'external_filesystem'" "$country"
          grep -Fq 'SPF_Fiscal_Evidence_Store_Registry::register' "$main"
          grep -Fq 'archive_batch_cdr' "$manager"
          grep -Fq 'archive_document_cdr' "$manager"
          grep -Fq 'SPF_Fiscal_Evidence_Manager::archive_batch_cdr' "$batch_manager"
          grep -Fq 'SPF_Fiscal_Evidence_Manager::archive_document_cdr' "$invoice_manager"
          grep -Fq "'beta_batch_evidence_error'" "$batch_manager"
          grep -Fq "'beta_evidence_error'" "$invoice_manager"
          grep -Fq "record(\$batch_id, 'evidence_archived'" "$batch_manager"
          grep -Fq "record(\$batch_id, 'evidence_error'" "$batch_manager"
          grep -Fq "\$parsed['cdr_zip_bytes'] = \$cdr;" "$transport"

          if grep -Fq 'cdr_zip_bytes' "$batch_manager" || grep -Fq 'cdr_xml_bytes' "$batch_manager"; then
            echo 'Raw CDR bytes must never enter generic batch manager/database metadata'
            exit 1
          fi
          if grep -Fq 'cdr_zip_bytes' "$invoice_manager" || grep -Fq 'cdr_xml_bytes' "$invoice_manager"; then
            echo 'Raw CDR bytes must never enter generic invoice manager/database metadata'
            exit 1
          fi
          if grep -RInE 'SoapClient|__soapCall|wp_remote_|curl_' --include='*evidence*.php' includes; then
            echo 'Evidence archive layer must remain network-free'
            exit 1
          fi
          if grep -RInF 'base64_encode' --include='*evidence*.php' includes; then
            echo 'Raw fiscal evidence must not be encoded for database persistence'
            exit 1
          fi
      - name: Ledger ordering with physical batch archive
        shell: bash
        run: |
          set -euo pipefail
          manager='includes/class-spf-fiscal-batch-beta-manager.php'
          poll_result_line="$(grep -n "record(\$batch_id, 'poll_result'" "$manager" | head -1 | cut -d: -f1)"
          archive_call_line="$(grep -n 'archive_batch_cdr(\$batch_id, \$result)' "$manager" | head -1 | cut -d: -f1)"
          archived_event_line="$(grep -n "record(\$batch_id, 'evidence_archived'" "$manager" | head -1 | cut -d: -f1)"
          final_store_line="$(grep -n 'store_result(\$batch_id, \$status, \$result, false)' "$manager" | tail -1 | cut -d: -f1)"
          test -n "$poll_result_line" -a -n "$archive_call_line" -a "$poll_result_line" -lt "$archive_call_line"
          test -n "$archived_event_line" -a -n "$final_store_line" -a "$archived_event_line" -lt "$final_store_line"
      - name: Synchronous invoice archive precedes final beta projection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path('includes/class-spf-fiscal-transport-manager.php').read_text(encoding='utf-8')
          patterns = {
              'response_received': r"record\(\$document_id\s*,\s*['\"]response_received['\"]",
              'archive': r"archive_document_cdr\(\$document_id\s*,\s*\$result\)",
              'evidence_archived': r"record\(\$document_id\s*,\s*['\"]evidence_archived['\"]",
              'final_projection': r"store_beta_result\(\$document_id\s*,\s*\$status\s*,\s*\$result\)",
              'evidence_error_projection': r"store_beta_result\(\$document_id\s*,\s*['\"]beta_evidence_error['\"]",
          }
          matches = {name: re.search(pattern, text) for name, pattern in patterns.items()}
          missing = [name for name, match in matches.items() if match is None]
          if missing:
              raise SystemExit('Missing invoice evidence invariant(s): ' + ', '.join(missing))
          order = [
              matches['response_received'].start(),
              matches['archive'].start(),
              matches['evidence_archived'].start(),
              matches['final_projection'].start(),
          ]
          if order != sorted(order) or len(set(order)) != len(order):
              raise SystemExit('Invoice evidence order must be response_received -> archive -> evidence_archived -> final projection')
          PY
      - name: Beta remains non-production
        shell: bash
        run: |
          set -euo pipefail
          batch_manager='includes/class-spf-fiscal-batch-beta-manager.php'
          invoice_manager='includes/class-spf-fiscal-transport-manager.php'
          if grep -En "['\"]fiscal_status['\"]\s*=>" "$batch_manager" "$invoice_manager"; then
            echo 'Evidence archive must never promote beta into fiscal_status'
            exit 1
          fi
          if grep -RInF 'e-factura.sunat.gob.pe' --include='*.php' .; then
            echo 'Production fiscal endpoint must remain absent'
            exit 1
          fi
