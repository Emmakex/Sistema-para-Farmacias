name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Fiscal XMLDSig smoke
        run: php tests/fiscal-signature-smoke.php
      - name: Fiscal XSD XSL smoke
        run: php tests/fiscal-validation-smoke.php
      - name: Peru daily SummaryDocuments smoke
        run: php tests/fiscal-daily-summary-smoke.php
      - name: Fiscal batch snapshot idempotency smoke
        run: php tests/fiscal-batch-persistence-smoke.php
      - name: Fiscal batch SummaryDocuments signing and validation smoke
        run: php tests/fiscal-batch-sign-validate-smoke.php
      - name: Peru invoice beta fail-closed smoke
        run: php tests/fiscal-beta-smoke.php
      - name: Peru daily summary beta fail-closed smoke
        run: php tests/fiscal-beta-summary-smoke.php
      - name: Country-neutral core guard
        shell: bash
        run: |
          set -euo pipefail
          violations="$(grep -RInE 'S/|SUNAT|Yape|Plin|\bIGV\b|\bRUC\b|\bDNI\b' \
            --include='*.php' \
            --exclude-dir='countries' \
            --exclude='fiscal-beta-smoke.php' \
            --exclude='fiscal-beta-summary-smoke.php' \
            --exclude='fiscal-daily-summary-smoke.php' \
            --exclude='fiscal-batch-persistence-smoke.php' \
            --exclude='fiscal-batch-sign-validate-smoke.php' \
            --exclude-dir='.git' \
            . || true)"
          if [ -n "$violations" ]; then
            echo "Country-specific literals found outside country packs:"
            echo "$violations"
            exit 1
          fi
      - name: Local fiscal layers remain network-free
        shell: bash
        run: |
          set -euo pipefail
          violations="$(grep -RInE 'wp_remote_|curl_|SoapClient|__soapCall|e-beta\.sunat\.gob\.pe|e-factura\.sunat\.gob\.pe' \
            --include='*.php' \
            --exclude='class-spf-fiscal-transport-peru-beta.php' \
            --exclude='fiscal-beta-smoke.php' \
            --exclude='fiscal-beta-summary-smoke.php' \
            includes tests || true)"
          if [ -n "$violations" ]; then
            echo "Network transport leaked outside the isolated beta transport:"
            echo "$violations"
            exit 1
          fi
      - name: Peru beta transport remains test-only and isolated
        shell: bash
        run: |
          set -euo pipefail
          beta='includes/countries/peru/class-spf-fiscal-transport-peru-beta.php'
          grep -Fq 'https://e-beta.sunat.gob.pe/ol-ti-itcpfegem-beta/billService?wsdl' "$beta"
          grep -Fq "__soapCall('sendBill'" "$beta"
          grep -Fq "__soapCall('sendSummary'" "$beta"
          grep -Fq "__soapCall('getStatus'" "$beta"
          grep -Fq "const TEST_USER = 'MODDATOS'" "$beta"
          grep -Fq "const TEST_PASSWORD = 'MODDATOS'" "$beta"
          grep -Fq 'SPF_FISCAL_BETA_SUMMARY_ENABLED' "$beta"
          grep -Fq 'SPF_FISCAL_BETA_SUMMARY_CONFIRMATION' "$beta"
          grep -Fq 'SUNAT_SUMMARY_TEST_ONLY' "$beta"
          if grep -Fq 'e-factura.sunat.gob.pe' "$beta"; then
            echo "Production endpoint is forbidden in the beta transport"
            exit 1
          fi
          if grep -RInF 'e-factura.sunat.gob.pe' --include='*.php' .; then
            echo "Production fiscal endpoint must remain absent from PHP"
            exit 1
          fi
          async_leaks="$(grep -RInE "__soapCall\(['\"](?:sendSummary|getStatus)['\"]" --include='*.php' --exclude='class-spf-fiscal-transport-peru-beta.php' includes tests || true)"
          if [ -n "$async_leaks" ]; then
            echo "Asynchronous authority operations leaked outside the isolated country transport:"
            echo "$async_leaks"
            exit 1
          fi
          grep -Fq "'default_transport'=>'dry_run'" includes/countries/class-spf-country-peru.php
      - name: Daily summary builder and lifecycle remain network-free
        shell: bash
        run: |
          set -euo pipefail
          builder='includes/countries/peru/class-spf-fiscal-batch-builder-peru-summary.php'
          grep -Fq "'2.0'" "$builder"
          grep -Fq "'1.1'" "$builder"
          grep -Fq "'03'" "$builder"
          grep -Fq "'ConditionCode'" "$builder"
          if grep -RInE "__soapCall|sendSummary|getStatus|e-beta\.sunat\.gob\.pe" --include='*batch*.php' includes; then
            echo "Generic batch layers must remain network-free and authority-neutral"
            exit 1
          fi
      - name: Fiscal batch persistence invariants
        shell: bash
        run: |
          set -euo pipefail
          repo='includes/class-spf-fiscal-batch-repository.php'
          activator='includes/class-spf-activator.php'
          manager='includes/class-spf-fiscal-batch-manager.php'
          grep -Fq 'GET_LOCK' "$repo"
          grep -Fq "START TRANSACTION" "$repo"
          grep -Fq "ROLLBACK" "$repo"
          grep -Fq "RELEASE_LOCK" "$repo"
          grep -Fq "snapshot_sha256" "$repo"
          grep -Fq "'snapshot_body'=>" "$repo"
          grep -Fq "NOT EXISTS" "$manager"
          grep -Fq "condition_code='1'" "$manager"
          grep -Fq 'CREATE TABLE $batches' "$activator"
          grep -Fq 'CREATE TABLE $batch_items' "$activator"
          grep -Fq 'UNIQUE KEY batch_identifier' "$activator"
          grep -Fq 'UNIQUE KEY batch_sequence' "$activator"
          grep -Fq 'UNIQUE KEY batch_snapshot' "$activator"
          grep -Fq 'UNIQUE KEY batch_document' "$activator"
          snapshot_columns="$(grep -Fc 'snapshot_body LONGTEXT NOT NULL' "$activator")"
          if [ "$snapshot_columns" -lt 2 ]; then
            echo "Batch and batch-item snapshot bodies must both be persisted"
            exit 1
          fi
      - name: Fiscal batch signing and validation invariants
        shell: bash
        run: |
          set -euo pipefail
          lifecycle='includes/class-spf-fiscal-batch-lifecycle.php'
          integrity='includes/class-spf-fiscal-batch-integrity.php'
          country='includes/countries/class-spf-country-peru.php'
          activator='includes/class-spf-activator.php'
          grep -Fq 'SPF_Fiscal_Batch_Integrity::reconstruct' "$lifecycle"
          grep -Fq 'signature_xml_sha256' "$lifecycle"
          grep -Fq 'signature_certificate_sha256' "$lifecycle"
          grep -Fq 'hash_equals($stored_signed_hash, $current_signed_hash)' "$lifecycle"
          grep -Fq 'hash_equals($stored_certificate_hash, $current_certificate_hash)' "$lifecycle"
          grep -Fq 'remote_ticket' "$lifecycle"
          grep -Fq 'spf_batch_remote_locked' "$lifecycle"
          grep -Fq 'snapshot_sha256' "$integrity"
          grep -Fq 'xml_sha256' "$integrity"
          grep -Fq "'SPF_FISCAL_PERU_SUMMARY_XSD_PATH'" "$country"
          grep -Fq "'SPF_FISCAL_PERU_SUMMARY_XSL_PATH'" "$country"
          grep -Fq 'signature_certificate_sha256 VARCHAR(64)' "$activator"
          grep -Fq 'signature_xml_sha256 VARCHAR(64)' "$activator"
          grep -Fq 'validation_xml_sha256 VARCHAR(64)' "$activator"
      - name: Async fiscal batch beta invariants
        shell: bash
        run: |
          set -euo pipefail
          manager='includes/class-spf-fiscal-batch-beta-manager.php'
          contract='includes/fiscal/interface-spf-fiscal-async-batch-transport.php'
          country='includes/countries/class-spf-country-peru.php'
          grep -Fq 'submit_batch(array $package)' "$contract"
          grep -Fq 'poll_batch(array $package)' "$contract"
          grep -Fq "'beta_transport'=>'peru_beta'" "$country"
          grep -Fq 'SPF_Fiscal_Batch_Lifecycle::validate_batch' "$manager"
          grep -Fq 'SPF_Fiscal_Batch_Integrity::reconstruct' "$manager"
          grep -Fq 'validation_xml_sha256' "$manager"
          grep -Fq 'signature_certificate_sha256' "$manager"
          grep -Fq 'remote_ticket' "$manager"
          grep -Fq "'production'=>false" "$manager"
          grep -Fq 'SUBMIT_COOLDOWN' "$manager"
          grep -Fq 'POLL_COOLDOWN' "$manager"
          grep -Fq 'GET_LOCK' "$manager"
          grep -Fq 'RELEASE_LOCK' "$manager"
          if grep -En "['\"]fiscal_status['\"]\s*=>" "$manager"; then
            echo "Beta batch manager must never write fiscal_status"
            exit 1
          fi
          if grep -En 'SUNAT|MODDATOS|sendSummary|getStatus|e-beta\.sunat\.gob\.pe' "$manager"; then
            echo "Authority-specific beta literals leaked into generic batch manager"
            exit 1
          fi
      - name: Fiscal credentials stay outside repository and database
        shell: bash
        run: |
          set -euo pipefail
          credential_files="$(find . -type f \( -iname '*.p12' -o -iname '*.pfx' -o -iname '*.pem' -o -iname '*.key' -o -iname '*.crt' \) -not -path './.git/*' -print)"
          if [ -n "$credential_files" ]; then
            echo "Credential-like files must not be committed:"
            echo "$credential_files"
            exit 1
          fi
          persistence="$(grep -RInE '(update_option|add_option|set_transient).*FISCAL_P12|response_body.*private_key|response_body.*P12_PASSWORD' --include='*.php' . || true)"
          if [ -n "$persistence" ]; then
            echo "Fiscal credential persistence detected:"
            echo "$persistence"
            exit 1
          fi
      - name: Official validation packs stay external
        shell: bash
        run: |
          set -euo pipefail
          validation_files="$(find . -type f \( -iname '*.xsd' -o -iname '*.xsl' -o -iname '*.xslt' \) -not -path './.git/*' -print)"
          if [ -n "$validation_files" ]; then
            echo "XSD/XSL validation resources must stay external to the plugin:"
            echo "$validation_files"
            exit 1
          fi
