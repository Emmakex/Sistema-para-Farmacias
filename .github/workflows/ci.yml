name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Fiscal XMLDSig smoke
        run: php tests/fiscal-signature-smoke.php
      - name: Fiscal XSD XSL smoke
        run: php tests/fiscal-validation-smoke.php
      - name: Peru daily SummaryDocuments smoke
        run: php tests/fiscal-daily-summary-smoke.php
      - name: Peru beta fail-closed smoke
        run: php tests/fiscal-beta-smoke.php
      - name: Country-neutral core guard
        shell: bash
        run: |
          set -euo pipefail
          violations="$(grep -RInE 'S/|SUNAT|Yape|Plin|\bIGV\b|\bRUC\b|\bDNI\b' \
            --include='*.php' \
            --exclude-dir='countries' \
            --exclude='fiscal-beta-smoke.php' \
            --exclude='fiscal-daily-summary-smoke.php' \
            --exclude-dir='.git' \
            . || true)"
          if [ -n "$violations" ]; then
            echo "Country-specific literals found outside country packs:"
            echo "$violations"
            exit 1
          fi
      - name: Local fiscal layers remain network-free
        shell: bash
        run: |
          set -euo pipefail
          violations="$(grep -RInE 'wp_remote_|curl_|SoapClient|__soapCall|e-beta\.sunat\.gob\.pe|e-factura\.sunat\.gob\.pe' \
            --include='*.php' \
            --exclude='class-spf-fiscal-transport-peru-beta.php' \
            --exclude='fiscal-beta-smoke.php' \
            includes tests || true)"
          if [ -n "$violations" ]; then
            echo "Network transport leaked outside the isolated beta transport:"
            echo "$violations"
            exit 1
          fi
      - name: Peru beta transport remains test-only
        shell: bash
        run: |
          set -euo pipefail
          beta='includes/countries/peru/class-spf-fiscal-transport-peru-beta.php'
          grep -Fq 'https://e-beta.sunat.gob.pe/ol-ti-itcpfegem-beta/billService?wsdl' "$beta"
          grep -Fq "__soapCall('sendBill'" "$beta"
          grep -Fq "const TEST_USER = 'MODDATOS'" "$beta"
          grep -Fq "const TEST_PASSWORD = 'MODDATOS'" "$beta"
          if grep -En "__soapCall\(['\"](?:sendSummary|getStatus)['\"]" "$beta"; then
            echo "Asynchronous SOAP operations are forbidden until the daily summary transport cut"
            exit 1
          fi
          if grep -Fq 'e-factura.sunat.gob.pe' "$beta"; then
            echo "Production endpoint is forbidden in the beta transport"
            exit 1
          fi
          if grep -RInF 'e-factura.sunat.gob.pe' --include='*.php' .; then
            echo "Production fiscal endpoint must remain absent from PHP"
            exit 1
          fi
          grep -Fq "'default_transport'=>'dry_run'" includes/countries/class-spf-country-peru.php
      - name: Daily summary remains local-only
        shell: bash
        run: |
          set -euo pipefail
          builder='includes/countries/peru/class-spf-fiscal-batch-builder-peru-summary.php'
          grep -Fq "'2.0'" "$builder"
          grep -Fq "'1.1'" "$builder"
          grep -Fq "'03'" "$builder"
          grep -Fq "'ConditionCode'" "$builder"
          if grep -RInE "__soapCall|sendSummary|getStatus" --include='*batch*.php' includes; then
            echo "Daily summary builder must remain network-free"
            exit 1
          fi
      - name: Fiscal credentials stay outside repository and database
        shell: bash
        run: |
          set -euo pipefail
          credential_files="$(find . -type f \( -iname '*.p12' -o -iname '*.pfx' -o -iname '*.pem' -o -iname '*.key' -o -iname '*.crt' \) -not -path './.git/*' -print)"
          if [ -n "$credential_files" ]; then
            echo "Credential-like files must not be committed:"
            echo "$credential_files"
            exit 1
          fi
          persistence="$(grep -RInE '(update_option|add_option|set_transient).*FISCAL_P12|response_body.*private_key|response_body.*P12_PASSWORD' --include='*.php' . || true)"
          if [ -n "$persistence" ]; then
            echo "Fiscal credential persistence detected:"
            echo "$persistence"
            exit 1
          fi
      - name: Official validation packs stay external
        shell: bash
        run: |
          set -euo pipefail
          validation_files="$(find . -type f \( -iname '*.xsd' -o -iname '*.xsl' -o -iname '*.xslt' \) -not -path './.git/*' -print)"
          if [ -n "$validation_files" ]; then
            echo "XSD/XSL validation resources must stay external to the plugin:"
            echo "$validation_files"
            exit 1
          fi
