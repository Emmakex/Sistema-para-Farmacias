name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Country-neutral core guard
        shell: bash
        run: |
          set -euo pipefail
          violations="$(grep -RInE 'S/|SUNAT|Yape|Plin|\bIGV\b|\bRUC\b|\bDNI\b' \
            --include='*.php' \
            --exclude-dir='countries' \
            --exclude-dir='.git' \
            . || true)"
          if [ -n "$violations" ]; then
            echo "Country-specific literals found outside country packs:"
            echo "$violations"
            exit 1
          fi
      - name: Fiscal preflight must not transport
        shell: bash
        run: |
          set -euo pipefail
          violations="$(grep -nE 'wp_remote_|curl_|SoapClient|sendBill|sendSummary' \
            includes/class-spf-fiscal-manager.php \
            includes/countries/peru/class-spf-fiscal-adapter-peru.php || true)"
          if [ -n "$violations" ]; then
            echo "Transport code found inside preflight-only fiscal cut:"
            echo "$violations"
            exit 1
          fi
